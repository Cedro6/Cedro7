name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bos_owner
          POSTGRES_PASSWORD: bos_owner
          POSTGRES_DB: bos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bos_owner -d bos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL_OWNER: postgres://bos_owner:bos_owner@localhost:5432/bos_test
      TEST_DATABASE_URL: postgres://bos_app:bos_app@localhost:5432/bos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the app database role
        run: psql "$TEST_DATABASE_URL_OWNER" -c "create role bos_app login password 'bos_app' nobypassrls"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
